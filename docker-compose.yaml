services:
  # --- Service Discovery ---
  eureka-server:
    build:
      context: ./backend
      dockerfile: eureka-server/Dockerfile
    container_name: cs4135-eureka-server
    restart: "no"
    ports:
      - "${EUREKA_PORT:-8761}:8761"
    networks:
      - cs4135-network

  # --- Backend Microservices ---
  api-gateway:
    build:
      context: ./backend
      dockerfile: api-gateway/Dockerfile
    container_name: cs4135-api-gateway
    restart: "no"
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      - EUREKA_URL=http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server
    networks:
      - cs4135-network

  user-service:
    build:
      context: ./backend
      dockerfile: user-service/Dockerfile
    container_name: cs4135-user-service
    restart: "no"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-cs4135db}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - SPRING_DATASOURCE_DRIVER=org.postgresql.Driver
      - JWT_SECRET=${JWT_SECRET}
      - EUREKA_URL=http://eureka-server:8761/eureka/
    depends_on:
      - postgres
      - eureka-server
    networks:
      - cs4135-network

  restaurant-service:
    build:
      context: ./backend
      dockerfile: restaurant-service/Dockerfile
    container_name: cs4135-restaurant-service
    restart: "no"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-cs4135db}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - SPRING_DATASOURCE_DRIVER=org.postgresql.Driver
      - EUREKA_URL=http://eureka-server:8761/eureka/
    depends_on:
      - postgres
      - eureka-server
    networks:
      - cs4135-network

  order-service:
    build:
      context: ./backend
      dockerfile: order-service/Dockerfile
    container_name: cs4135-order-service
    restart: "no"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-cs4135db}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - SPRING_DATASOURCE_DRIVER=org.postgresql.Driver
      - EUREKA_URL=http://eureka-server:8761/eureka/
    depends_on:
      - postgres
      - eureka-server
    networks:
      - cs4135-network

  payment-service:
    build:
      context: ./backend
      dockerfile: payment-service/Dockerfile
    container_name: cs4135-payment-service
    restart: "no"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-cs4135db}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - SPRING_DATASOURCE_DRIVER=org.postgresql.Driver
      - EUREKA_URL=http://eureka-server:8761/eureka/
    depends_on:
      - postgres
      - eureka-server
    networks:
      - cs4135-network

  delivery-service:
    build:
      context: ./backend
      dockerfile: delivery-service/Dockerfile
    container_name: cs4135-delivery-service
    restart: "no"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-cs4135db}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - SPRING_DATASOURCE_DRIVER=org.postgresql.Driver
      - EUREKA_URL=http://eureka-server:8761/eureka/
    depends_on:
      - postgres
      - eureka-server
    networks:
      - cs4135-network

  notification-service:
    build:
      context: ./backend
      dockerfile: notification-service/Dockerfile
    container_name: cs4135-notification-service
    restart: "no"
    environment:
      - EUREKA_URL=http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server
    networks:
      - cs4135-network

  # --- Frontend ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cs4135-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - api-gateway
    networks:
      - cs4135-network

  # --- Infrastructure ---
  postgres:
    image: postgres:15-alpine
    container_name: cs4135-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-cs4135db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - cs4135-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: cs4135-rabbitmq
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    networks:
      - cs4135-network

networks:
  cs4135-network:
    driver: bridge

volumes:
  postgres-data:
